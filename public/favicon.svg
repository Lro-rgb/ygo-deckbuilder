<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rahmen wie im Portfolio (luis-rosado.ch), damit die Projekte zusammengehören. -->
  <rect width="64" height="64" rx="12" fill="#0D1117"/>
  <rect x="4" y="4" width="56" height="56" rx="9" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <!--
    Zwei Karten statt eines Buchstabens: das Zeichen soll das Projekt meinen,
    nicht die Person. Bewusst gross und kontrastreich — als 32px-Favicon
    verschwindet sonst die hintere Karte und es bleibt ein blauer Fleck.
  -->
  <rect x="13" y="16" width="23" height="32" rx="3" fill="#768390" transform="rotate(-15 24.5 32)"/>
  <rect x="27" y="15" width="24" height="34" rx="3.5" fill="#58A6FF" stroke="#161B22" stroke-width="2"/>
</svg>
